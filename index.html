function u8(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open(pw){
  var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c)));
  try{sessionStorage.setItem('sgpw',pw)}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();var b=document.getElementById('go'),er=document.getElementById('err');b.disabled=true;er.textContent='Unlocking…';
  try{await open(document.getElementById('pw').value)}catch(x){er.textContent='Wrong password. Try again.';b.disabled=false}
});
try{var s=sessionStorage.getItem('sgpw');if(s)open(s).catch(function(){sessionStorage.removeItem('sgpw')})}catch(e){}
